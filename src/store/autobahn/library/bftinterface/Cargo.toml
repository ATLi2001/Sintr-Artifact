[package]
name = "bftinterface"
version = "0.1.0"
authors = ["Austin Li <atl63@cornell.edu>"]
edition = "2018"

[lib]
crate-type = ["staticlib"]

[dependencies]
tokio = { version = "1.5.0", features = ["full"] }
tokio-util = { version = "0.6.2", features= ["codec"] }
clap = "2.33.3"
env_logger = "0.7.1"
log = "0.4.11"
bytes = "1.0.1"
bincode = "1.3.1"
anyhow = "1.0.40"
rand = "0.7.3"
futures = "0.3.15"
cxx = "1.0"

config = { path = "../config" }
store = { path = "../store" }
crypto = { path = "../crypto" }
primary = { path = "../primary" }
worker = { path = "../worker" }
bridge_debug = { path = "../bridge_debug" }
#hotstuff = { path = "../hotstuff" }
#sailfish = { path = "../sailfish" }

[build-dependencies]
cxx-build = "1.0"
